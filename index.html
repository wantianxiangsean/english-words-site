<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每周2篇英语短文，养成阅读习惯</title>
<style>
  :root {
    --ink: #111111;
    --line: #111111;
    --soft-line: #e6e6e6;
    --muted: #6b6b6b;
    --paper: #ffffff;
    --surface: #f7f7f7;
    --surface-2: #fbfbfb;
    --hover: #f2f2f2;
    --danger: #9b1c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .38; }

  .page {
    width: min(960px, calc(100% - 40px));
    margin: 0 auto;
    padding: 34px 0 96px;
  }
  h1 {
    margin: 0 0 22px;
    text-align: center;
    font-size: clamp(27px, 3.2vw, 35px);
    line-height: 1.22;
    font-weight: 700;
    letter-spacing: .01em;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--soft-line);
  }
  .toolbar-left { flex: 1 1 280px; max-width: 340px; }
  .toolbar-right { display: flex; align-items: center; gap: 10px; }
  .profile-picker { display: flex; align-items: center; gap: 6px; }
  .profile-select {
    max-width: 150px;
    border: 1px solid #d2d2d2;
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 14px;
    background: #fff;
    outline: none;
  }
  .profile-select:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(0, 0, 0, .06); }
  .global-search {
    width: 100%;
    border: 1px solid #d2d2d2;
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 14px;
    outline: none;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .global-search:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(0, 0, 0, .06); }
  .btn {
    border: 1px solid #d2d2d2;
    background: #fff;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s ease;
  }
  .btn:hover:not(:disabled) { background: var(--hover); border-color: #111; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid #111;
    outline-offset: 2px;
  }
  .btn.primary { background: #111; border-color: #111; color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #2c2c2c; border-color: #2c2c2c; }
  .btn.small { font-size: 13px; padding: 5px 10px; border-color: #d9d9d9; }
  .btn.icon {
    width: 38px;
    height: 38px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    border-color: transparent;
    color: #555;
    font-size: 17px;
  }
  .btn.icon:hover:not(:disabled) { background: #f5f5f5; border-color: #e2e2e2; color: #111; }
  .btn.danger { border-color: #e2b6b6; color: var(--danger); }
  .btn.danger:hover:not(:disabled) { background: #fdf4f4; border-color: #b33; }
  .banner {
    display: none;
    margin: 0 0 28px;
    padding: 10px 14px;
    border: 1px solid #e3e3e3;
    border-left: 3px solid #111;
    background: var(--surface-2);
    color: #4f4f4f;
    font-size: 13px;
    border-radius: 6px;
  }
  .banner.show { display: block; }

  .section { margin-bottom: 46px; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--soft-line);
  }
  .section-head h2 {
    margin: 0;
    font-size: 19px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: .01em;
  }
  .count-pill {
    display: inline-block;
    margin-left: 7px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--surface);
    color: #555;
    font-size: 12px;
    font-weight: 500;
    vertical-align: 1px;
    font-variant-numeric: tabular-nums;
  }
  .move-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
  }
  .table-wrap {
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow-x: auto;
    background: #fff;
  }
  table {
    width: 100%;
    min-width: 880px;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    padding: 10px 11px;
    border-bottom: 1px solid #ededed;
    font-size: 13px;
    vertical-align: middle;
    text-align: left;
    word-break: break-word;
  }
  th {
    background: var(--surface);
    color: #222;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    letter-spacing: .02em;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody tr:nth-child(even) { background: #fcfcfc; }
  tbody tr:hover { background: #f6f6f6; }
  tr:last-child td { border-bottom: 0; }
  th.col-check, td.col-check { width: 42px; text-align: center; }
  th.col-word, td.col-word { width: 96px; }
  th.col-meaning, td.col-meaning { width: 96px; }
  th.col-pos, td.col-pos { width: 72px; }
  th.col-collocation, td.col-collocation { width: 170px; }
  th.col-sentence, td.col-sentence { width: 270px; }
  th.col-count, td.col-count { width: 84px; }
  th.col-actions, td.col-actions { width: 74px; text-align: center; white-space: nowrap; }
  .sort-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 0;
    background: transparent;
    padding: 0;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .sort-btn:hover { color: #000; text-decoration: underline; text-underline-offset: 2px; }
  .sort-icon { color: #777; font-size: 12px; }
  td.cell { cursor: text; }
  td.cell:hover { background: #fff; box-shadow: inset 0 0 0 1px #dcdcdc; }
  .sense-lines { display: flex; flex-direction: column; gap: 3px; }
  .sense-line {
    min-height: 20px;
    line-height: 1.45;
    padding: 1px 2px;
    border-radius: 3px;
    cursor: text;
  }
  .sense-line:hover { background: #f1f1f1; }
  .sense-line + .sense-line { border-top: 1px dashed #ededed; }
  .sense-empty { color: #c2c2c2; }
  .cell-input {
    width: 100%;
    border: 1px solid #999;
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 13px;
    outline: none;
    background: #fff;
  }
  .muted { color: var(--muted); }
  .empty-cell { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 14px; }
  .inline-note { font-size: 13px; color: var(--muted); }
  .link-btn {
    border: 0;
    background: transparent;
    padding: 0 3px;
    color: #333;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-size: 13px;
  }
  .link-btn:hover { color: #000; }
  .link-btn.danger { color: var(--danger); }
  .icon-action {
    border: 1px solid transparent;
    background: transparent;
    color: #777;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 14px;
    line-height: 1.2;
    transition: background .15s, color .15s, border-color .15s;
  }
  .icon-action:hover { background: #f1f1f1; border-color: #e3e3e3; color: #111; }
  .icon-action.danger:hover { background: #fdf3f3; border-color: #e8c6c6; color: var(--danger); }
  td.col-count { text-align: center; font-variant-numeric: tabular-nums; }
  input[type="checkbox"] { width: 15px; height: 15px; accent-color: #111; }

  .basic-box {
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 150px;
    max-height: 460px;
    overflow: auto;
    padding: 16px 18px 20px;
    background: #fff;
  }
  .basic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    column-gap: 26px;
    row-gap: 0;
  }
  .basic-item {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 34px;
    padding: 2px 4px;
    border-bottom: 1px solid #f0f0f0;
    border-radius: 4px;
  }
  .basic-item:hover { background: #fafafa; }
  .basic-item .basic-word { flex: 1; font-size: 15px; overflow-wrap: anywhere; }
  .basic-empty { grid-column: 1 / -1; color: var(--muted); padding: 10px 0; }

  .toast-layer {
    position: fixed;
    right: 22px;
    bottom: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 120;
    pointer-events: none;
  }
  .toast {
    max-width: 360px;
    background: #111;
    color: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    opacity: .97;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
    pointer-events: auto;
  }
  .toast.warn { background: #7a4b00; }
  .toast.error { background: #8c1414; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(0, 0, 0, .38);
    backdrop-filter: blur(2px);
  }
  .modal {
    width: min(740px, 100%);
    max-height: 90vh;
    overflow: auto;
    background: #fff;
    border: 1px solid #111;
    border-radius: 12px;
    padding: 24px 26px 20px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .22);
    animation: modal-in .16s ease-out;
  }
  .modal.wide { width: min(940px, 100%); }
  .modal h3 {
    margin: 0 0 6px;
    font-size: 21px;
    line-height: 1.3;
    letter-spacing: .01em;
  }
  .modal h4 {
    margin: 24px 0 10px;
    font-size: 15px;
    font-weight: 700;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--soft-line);
  }
  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; margin-bottom: 5px; font-size: 13px; color: #444; font-weight: 500; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    padding: 9px 11px;
    outline: none;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    border-color: #111;
    box-shadow: 0 0 0 3px rgba(0, 0, 0, .06);
  }
  .form-row textarea { min-height: 120px; resize: vertical; }
  .form-hint { font-size: 12px; color: #6b6b6b; margin-top: 5px; }

  .progress-track {
    height: 8px;
    background: #efefef;
    border-radius: 999px;
    overflow: hidden;
    margin: 20px 0 12px;
  }
  .progress-fill {
    width: 0;
    height: 100%;
    background: #111;
    transition: width .25s ease;
  }
  .status-line { min-height: 22px; font-size: 13px; color: #555; }
  .status-line.ok { color: #1b5e20; }
  .status-line.err { color: var(--danger); }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(8px) scale(.99); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .article-meta { color: #666; font-size: 13px; margin-bottom: 18px; }
  .article-warning {
    border: 1px solid #e0c98e;
    border-left: 3px solid #b8860b;
    background: #fffaf0;
    color: #6f4a00;
    padding: 10px 13px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .article-body {
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    font-size: 18px;
    line-height: 1.95;
    white-space: normal;
    word-break: break-word;
  }
  .article-body .hl { font-weight: 700; }
  .translation {
    font-size: 15px;
    line-height: 1.9;
    color: #3a3a3a;
    white-space: pre-wrap;
  }
  .glossary { min-width: 0; width: 100%; table-layout: auto; }
  .glossary th, .glossary td { font-size: 13px; }
  .glossary td:first-child { font-weight: 600; }
  .spell-correct { font-weight: 700; }
  .new-word-list { border-top: 1px solid var(--soft-line); }
  .new-word-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 2px;
    border-bottom: 1px solid var(--soft-line);
  }
  .new-word-item:last-child { border-bottom: 0; }
  .new-word { flex: 1; font-weight: 600; }
  .profile-list { border-top: 1px solid var(--line); margin-top: 12px; }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--soft-line);
  }
  .profile-name-input {
    flex: 1;
    min-width: 0;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    outline: none;
  }
  .profile-name-input:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,.06); }
  .profile-add { display: flex; gap: 8px; }
  .profile-add input {
    flex: 1;
    min-width: 0;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    padding: 9px 11px;
    outline: none;
  }
  .profile-add input:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,.06); }

  .history-list { border-top: 1px solid var(--line); }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 13px 6px;
    border-bottom: 1px solid var(--soft-line);
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
  }
  .history-item:hover { background: #f7f7f7; }
  .history-title { font-size: 15px; font-weight: 500; }
  .history-meta { color: #6b6b6b; font-size: 12px; white-space: nowrap; }
  .badge {
    display: inline-block;
    border: 1px solid #999;
    border-radius: 999px;
    padding: 0 6px;
    font-size: 11px;
    color: #555;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .badge.bad { border-color: #bc8b2c; color: #7a4b00; }

  @media (max-width: 720px) {
    .page { width: calc(100% - 24px); padding-top: 18px; }
    h1 { font-size: 25px; margin-bottom: 14px; }
    .toolbar { flex-direction: column; align-items: stretch; margin-bottom: 22px; }
    .toolbar-left { max-width: none; }
    .toolbar-right { justify-content: center; flex-wrap: wrap; }
    .section-head { flex-direction: column; align-items: flex-start; gap: 10px; }
    .move-bar { justify-content: flex-start; }
    .modal { padding: 18px 16px; border-radius: 10px; }
    .basic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; }
    .modal-actions { justify-content: stretch; }
    .modal-actions .btn { flex: 1 1 auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<div class="page">
  <h1>每周2篇英语短文，养成阅读习惯</h1>
  <div class="toolbar">
    <div class="toolbar-left">
      <input class="global-search" id="global-search" type="search" placeholder="搜索单词或词意…">
    </div>
    <div class="toolbar-right">
      <div class="profile-picker">
        <select class="profile-select" id="profile-select" title="选择用户"></select>
        <button class="btn icon" id="btn-profiles" title="用户管理" aria-label="用户管理">👤</button>
      </div>
      <button class="btn" id="btn-entry">词汇录入</button>
      <button class="btn primary" id="btn-article">文章生成</button>
      <button class="btn icon" id="btn-backup" title="云端备份" aria-label="云端备份">☁</button>
      <button class="btn icon" id="btn-settings" title="AI 设置" aria-label="AI 设置">⚙</button>
    </div>
  </div>
  <div class="banner" id="banner"></div>
  <main id="sections"></main>
</div>
<div class="toast-layer" id="toast-layer"></div>
<div id="modal-root"></div>

<script>
const STORAGE_KEY = "yoyo-english-state-v2";
const LEGACY_STORAGE_KEY = "yoyo-english-state-v1";
const CATEGORY_ORDER = ["high", "medium", "low", "familiar", "basic"];
const CATEGORY_META = {
  high:    { label: "高频复习词汇", short: "高频", table: true },
  medium:  { label: "中频复习词汇", short: "中频", table: true },
  low:     { label: "低频复习词汇", short: "低频", table: true },
  familiar:{ label: "牢记词汇", short: "牢记", table: true, showCount: true },
  basic:   { label: "基础词汇", short: "基础", table: false, showCount: true }
};
const ARTICLE_CATEGORIES = ["high", "medium"];
const EDITABLE_FIELDS = [
  { field: "meaning", label: "词意", cls: "col-meaning" },
  { field: "partOfSpeech", label: "词性", cls: "col-pos" },
  { field: "collocation", label: "搭配", cls: "col-collocation" },
  { field: "sentence", label: "造句", cls: "col-sentence" }
];
const YOUYOU_SEED_FLAG = "yoyo-youyou-seed-v8";
const YOUYOU_FILL_FLAG = "yoyo-youyou-fill-v3";
const BACKUP_CONFIG_KEY = "yoyo-backup-config-v1";
const BACKUP_PRE_RESTORE_KEY = "yoyo-english-pre-restore-v1";
const DEFAULT_BACKUP_CONFIG = {
  repo: "wantianxiangsean/yoyo-english-backup",
  branch: "main",
  path: "yoyo-english-backup.json",
  remember: false,
  hasToken: false,
  token: ""
};
const YOUYOU_SEED = [];
const YOUYOU_DISPLAY_OVERRIDES = {};
const YOUYOU_MEANING_OVERRIDES = {};

let state = loadState();
let ui = {
  selected: { high: new Set(), medium: new Set(), low: new Set(), familiar: new Set(), basic: new Set() },
  searchQuery: "",
  sort: { high: null, medium: null, low: null, familiar: null },
  modal: null,
  serverOnline: false,
  aiConfigured: false,
  config: { baseUrl: "https://api.deepseek.com/v1", model: "deepseek-chat", hasKey: false }
};

function migrateWord(word) {
  word.id = String(word.id || uid());
  word.text = String(word.text || word.word || "").trim();
  word.key = word.key || normalizeKey(word.text);
  word.category = CATEGORY_ORDER.includes(word.category) ? word.category : "high";
  word.meaning = String(word.meaning || "");
  word.partOfSpeech = String(word.partOfSpeech || "");
  word.collocation = String(word.collocation || "");
  word.sentence = String(word.sentence || "");
  word.meanings = normalizeMeanings(word.meanings || word.senses || []);
  if (!word.meanings.length && (word.meaning || word.partOfSpeech || word.collocation || word.sentence)) {
    word.meanings = [{
      meaning: word.meaning,
      senses: [{
        partOfSpeech: word.partOfSpeech,
        collocation: word.collocation,
        sentence: word.sentence
      }]
    }];
  }
  syncLegacyFields(word);
  word.forms = Array.isArray(word.forms) && word.forms.length ? word.forms : [word.key].filter(Boolean);
  word.count = Number(word.count) || 0;
  word.status = word.status || (word.meaning || word.sentence ? "ready" : "pending");
  word.createdAt = Number(word.createdAt) || Date.now();
  word.updatedAt = Number(word.updatedAt) || word.createdAt;
}

function migrateArticle(article) {
  article.id = String(article.id || uid());
  article.matches = Array.isArray(article.matches) ? article.matches : [];
  article.translationMatches = Array.isArray(article.translationMatches)
    ? article.translationMatches
    : [];
  article.newWords = Array.isArray(article.newWords) ? article.newWords : [];
  article.wordCounts = article.wordCounts || {};
  article.cumulativeCounts = article.cumulativeCounts || {};
  article.snapshot = Array.isArray(article.snapshot) ? article.snapshot : [];
  article.targetIds = Array.isArray(article.targetIds) ? article.targetIds : [];
}

function normalizeProfile(profile) {
  const value = profile && typeof profile === "object" ? profile : {};
  const id = String(value.id || uid());
  const name = String(value.name || "未命名").trim() || "未命名";
  const words = Array.isArray(value.words) ? value.words : [];
  const articles = Array.isArray(value.articles) ? value.articles : [];
  words.forEach(migrateWord);
  articles.forEach(migrateArticle);
  return {
    id,
    name,
    words,
    articles,
    createdAt: Number(value.createdAt) || Date.now()
  };
}

function defaultState() {
  const profileId = uid();
  return {
    version: 2,
    activeProfileId: profileId,
    profiles: [{
      id: profileId,
      name: "默认",
      words: [],
      articles: [],
      createdAt: Date.now()
    }]
  };
}

function normalizeStateObject(parsed) {
  if (!parsed || typeof parsed !== "object") return defaultState();
  let value = parsed;
  if (!Array.isArray(value.profiles) || !value.profiles.length) {
    const profileId = uid();
    value = {
      version: 2,
      activeProfileId: profileId,
      profiles: [{
        id: profileId,
        name: "默认",
        words: Array.isArray(value.words) ? value.words : [],
        articles: Array.isArray(value.articles) ? value.articles : [],
        createdAt: Date.now()
      }]
    };
  }
  value.profiles = value.profiles.map(normalizeProfile);
  if (!value.activeProfileId || !value.profiles.some((profile) => profile.id === value.activeProfileId)) {
    value.activeProfileId = value.profiles[0].id;
  }
  value.version = 2;
  return value;
}

function loadState() {
  try {
    let parsed = null;
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) parsed = JSON.parse(raw);
    if (!parsed) {
      const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (legacyRaw) {
        const legacy = JSON.parse(legacyRaw);
        const profileId = uid();
        parsed = {
          version: 2,
          activeProfileId: profileId,
          profiles: [{
            id: profileId,
            name: "默认",
            words: Array.isArray(legacy.words) ? legacy.words : [],
            articles: Array.isArray(legacy.articles) ? legacy.articles : [],
            createdAt: Date.now()
          }]
        };
      }
    }
    const value = normalizeStateObject(parsed);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    } catch (error) {
      console.error(error);
    }
    return value;
  } catch (error) {
    console.error(error);
    return defaultState();
  }
}

function activeProfile() {
  return state.profiles.find((profile) => profile.id === state.activeProfileId) || state.profiles[0];
}

function getWords() {
  return activeProfile().words;
}

function getArticles() {
  return activeProfile().articles;
}

function setWords(words) {
  activeProfile().words = words;
}

function setArticles(articles) {
  activeProfile().articles = articles;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (error) {
    toast("浏览器本地存储空间不足，保存失败", "error");
    console.error(error);
  }
}

function seedCoreKey(text) {
  let value = normalizeKey(text).replace(/\u2011/g, "-");
  value = value.replace(/[（(][^）)]*[）)]/g, " ");
  value = value.split("=")[0];
  value = value.replace(/[?？…!！.,，:：;；]/g, " ");
  return value.replace(/\s+/g, " ").trim();
}

function seedForms(text) {
  const forms = new Set();
  const normalized = normalizeKey(text);
  const add = (value) => {
    const cleaned = String(value || "").replace(/\s+/g, " ").trim();
    if (cleaned) forms.add(cleaned);
  };
  add(normalized);
  add(normalized.replace(/\u2011/g, "-"));
  const noParen = normalized.replace(/[（(][^）)]*[）)]/g, " ").replace(/\s+/g, " ").trim();
  add(noParen);
  [...normalized.matchAll(/[（(]([^）)]*)[）)]/g)].forEach((match) => add(match[1]));
  add(normalized.replace(/[?？…!！.,，:：;；]/g, " ").replace(/\s+/g, " ").trim());
  Array.from(forms).forEach((form) => {
    form.split("=").forEach((part) => add(part));
  });
  return Array.from(forms);
}

function seedYouyouWords() {
  try {
    if (localStorage.getItem(YOUYOU_SEED_FLAG) === "1") return;
    const youyouProfiles = state.profiles.filter(
      (item) => normalizeKey(item.name) === normalizeKey("默认")
    );
    let profile = youyouProfiles[0];
    if (!profile) {
      profile = {
        id: uid(),
        name: "默认",
        words: [],
        articles: [],
        createdAt: Date.now()
      };
      state.profiles.push(profile);
    } else if (youyouProfiles.length > 1) {
      // Merge accidental duplicate 默认 profiles into the first one.
      const knownWords = new Set(profile.words.map((word) => word.key));
      const knownArticles = new Set(profile.articles.map((article) => article.id));
      youyouProfiles.slice(1).forEach((extra) => {
        extra.words.forEach((word) => {
          if (!knownWords.has(word.key)) {
            knownWords.add(word.key);
            profile.words.push(word);
          }
        });
        extra.articles.forEach((article) => {
          if (!knownArticles.has(article.id)) {
            knownArticles.add(article.id);
            profile.articles.push(article);
          }
        });
      });
      const mergedIds = new Set(youyouProfiles.slice(1).map((item) => item.id));
      state.profiles = state.profiles.filter((item) => !mergedIds.has(item.id));
      if (mergedIds.has(state.activeProfileId)) state.activeProfileId = profile.id;
    }
    const seedEntries = YOUYOU_SEED.map(([rawText, rawMeaning]) => {
      const core = seedCoreKey(rawText);
      const text = YOUYOU_DISPLAY_OVERRIDES[core] || rawText;
      const meaning = YOUYOU_MEANING_OVERRIDES[core] || rawMeaning;
      return {
        core,
        text,
        meaning,
        key: normalizeKey(text),
        forms: seedForms(text)
      };
    });
    const byCore = new Map(seedEntries.map((entry) => [entry.core, entry]));
    profile.words.forEach((word) => {
      const entry = byCore.get(seedCoreKey(word.text));
      if (!entry) return;
      const placeholder = !word.partOfSpeech && !word.collocation && !word.sentence;
      word.text = entry.text;
      word.key = entry.key;
      word.forms = entry.forms;
      if (placeholder) {
        word.meaning = entry.meaning;
        word.meanings = [{
          meaning: entry.meaning,
          senses: [{ partOfSpeech: "", collocation: "", sentence: "" }]
        }];
      }
    });
    const existingCore = new Set(profile.words.map((word) => seedCoreKey(word.text)));
    const now = Date.now();
    seedEntries.forEach((entry, index) => {
      if (existingCore.has(entry.core)) return;
      existingCore.add(entry.core);
      profile.words.push({
        id: uid(),
        text: entry.text,
        key: entry.key,
        category: "high",
        meaning: entry.meaning,
        partOfSpeech: "",
        collocation: "",
        sentence: "",
        meanings: [{
          meaning: entry.meaning,
          senses: [{ partOfSpeech: "", collocation: "", sentence: "" }]
        }],
        forms: entry.forms,
        count: 0,
        status: "ready",
        createdAt: now + index,
        updatedAt: now + index
      });
    });
    state.activeProfileId = profile.id;
    saveState();
    localStorage.setItem(YOUYOU_SEED_FLAG, "1");
    toast(`已更新「默认」词库，共 ${profile.words.length} 个单词`);
  } catch (error) {
    console.error(error);
  }
}

function needsFields(word) {
  const groups = Array.isArray(word.meanings) ? word.meanings : [];
  if (!groups.length) return true;
  return groups.some((group) => {
    const senses = group.senses || [];
    return !senses.length || senses.some(
      (sense) => !sense.partOfSpeech || !sense.collocation || !sense.sentence
    );
  });
}

async function fillMissingFields(category) {
  const words = getWords().filter(
    (word) => word.category === category && needsFields(word)
  );
  if (!words.length) {
    toast("该类别字段已齐全");
    return;
  }
  const ok = window.confirm(
    `有 ${words.length} 个单词缺少词性/搭配/造句，将调用 AI 分批补齐；会保留现有中文词意。继续吗？`
  );
  if (!ok) return;
  const withMeanings = words.filter(
    (word) => Array.isArray(word.meanings) && word.meanings.length
  );
  const withoutMeanings = words.filter(
    (word) => !(Array.isArray(word.meanings) && word.meanings.length)
  );
  if (withoutMeanings.length) {
    await generateWords(withoutMeanings.map((word) => word.id));
  }
  if (withMeanings.length) {
    await fillWordFields(withMeanings.map((word) => word.id));
  }
}

async function autoFillYouyouFields() {
  try {
    if (localStorage.getItem(YOUYOU_FILL_FLAG) === "1") return;
    const profile = state.profiles.find(
      (item) => normalizeKey(item.name) === normalizeKey("默认")
    );
    if (!profile) return;
    const words = profile.words.filter(
      (word) => word.category !== "basic" && needsFields(word)
    );
    if (!words.length) {
      localStorage.setItem(YOUYOU_FILL_FLAG, "1");
      return;
    }
    if (!ui.serverOnline || !ui.aiConfigured) {
      toast("默认词库已导入；配置 AI 后可点“补齐字段”批量生成", "warn");
      return;
    }
    localStorage.setItem(YOUYOU_FILL_FLAG, "1");
    state.activeProfileId = profile.id;
    saveState();
    render();
    toast(`开始为默认补齐 ${words.length} 个单词的字段`, "warn");
    const withMeanings = words.filter(
      (word) => Array.isArray(word.meanings) && word.meanings.length
    );
    const withoutMeanings = words.filter(
      (word) => !(Array.isArray(word.meanings) && word.meanings.length)
    );
    if (withoutMeanings.length) {
      await generateWords(withoutMeanings.map((word) => word.id));
    }
    if (withMeanings.length) {
      await fillWordFields(withMeanings.map((word) => word.id));
    }
  } catch (error) {
    console.error(error);
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function normalizeKey(value) {
  return String(value || "")
    .replace(/[\u2018\u2019`]/g, "'")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

function normalizeSenseVariant(sense) {
  return {
    partOfSpeech: String((sense && sense.partOfSpeech) || "").trim(),
    collocation: String((sense && sense.collocation) || "").trim(),
    sentence: String((sense && sense.sentence) || "").trim()
  };
}

function senseHasContent(sense) {
  return !!(sense && (sense.partOfSpeech || sense.collocation || sense.sentence));
}

function normalizeMeaningGroup(group) {
  const meaning = String((group && group.meaning) || "").trim();
  let rawSenses = group && group.senses;
  if (!Array.isArray(rawSenses)) rawSenses = [];
  const senses = rawSenses.map(normalizeSenseVariant).filter(senseHasContent);
  if (!senses.length && group && (group.partOfSpeech || group.collocation || group.sentence)) {
    const variant = normalizeSenseVariant(group);
    if (senseHasContent(variant)) senses.push(variant);
  }
  return { meaning, senses };
}

function normalizeMeanings(input) {
  if (!Array.isArray(input)) return [];
  const groups = [];
  input.forEach((item) => {
    if (!item || typeof item !== "object") return;
    if (Array.isArray(item.senses)) {
      const group = normalizeMeaningGroup(item);
      if (group.meaning || group.senses.length) groups.push(group);
      return;
    }
    const flat = {
      meaning: String(item.meaning || "").trim(),
      ...normalizeSenseVariant(item)
    };
    if (!flat.meaning && !senseHasContent(flat)) return;
    const key = normalizeKey(flat.meaning) || "__empty__";
    let group = groups.find(
      (candidate) => (normalizeKey(candidate.meaning) || "__empty__") === key
    );
    if (!group) {
      group = { meaning: flat.meaning, senses: [] };
      groups.push(group);
    }
    group.senses.push({
      partOfSpeech: flat.partOfSpeech,
      collocation: flat.collocation,
      sentence: flat.sentence
    });
  });
  return groups;
}

function wordMeaningGroups(item) {
  if (Array.isArray(item && item.meanings) && item.meanings.length) {
    return item.meanings;
  }
  if (item && (item.meaning || item.partOfSpeech)) {
    return [{
      meaning: item.meaning || "",
      senses: [{ partOfSpeech: item.partOfSpeech || "" }]
    }];
  }
  return [];
}

function syncLegacyFields(word) {
  const firstMeaning = (word.meanings || [])[0] || {};
  const firstSense = (firstMeaning.senses || [])[0] || {};
  word.meaning = firstMeaning.meaning || "";
  word.partOfSpeech = firstSense.partOfSpeech || "";
  word.collocation = firstSense.collocation || "";
  word.sentence = firstSense.sentence || "";
}

function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/\n/g, " ");
}

function formatDate(timestamp) {
  const date = new Date(timestamp);
  const pad = (number) => String(number).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function toast(message, type) {
  const layer = document.getElementById("toast-layer");
  const item = document.createElement("div");
  item.className = "toast" + (type ? " " + type : "");
  item.textContent = message;
  layer.appendChild(item);
  setTimeout(() => item.remove(), 3600);
}

function wordsForCategory(category) {
  return getWords()
    .filter((word) => word.category === category)
    .sort((a, b) => a.key.localeCompare(b.key, "en"));
}

function matchesSearch(word) {
  const query = normalizeKey(ui.searchQuery || "");
  if (!query) return true;
  const meaning = String(word.meaning || "").toLowerCase();
  const senseMeanings = (word.meanings || [])
    .map((group) => String(group.meaning || "").toLowerCase())
    .join(" ");
  return word.key.includes(query) || meaning.includes(query) || senseMeanings.includes(query);
}

function sortWordsForCategory(category, words) {
  const mode = ui.sort[category];
  if (!mode) return words;
  return words.slice().sort((a, b) => {
    const delta = (Number(a.count) || 0) - (Number(b.count) || 0);
    if (delta !== 0) return mode === "asc" ? delta : -delta;
    return a.key.localeCompare(b.key, "en");
  });
}

function toggleSort(category) {
  const current = ui.sort[category] || null;
  ui.sort[category] = current === null ? "asc" : (current === "asc" ? "desc" : null);
  render();
}

function categoryCount(category) {
  return getWords().filter((word) => word.category === category).length;
}

function render() {
  renderProfileSelect();
  document.getElementById("sections").innerHTML = CATEGORY_ORDER.map(renderSection).join("");
  renderBanner();
}

function renderProfileSelect() {
  const select = document.getElementById("profile-select");
  if (!select) return;
  select.innerHTML = state.profiles
    .map((profile) => `<option value="${profile.id}" ${profile.id === state.activeProfileId ? "selected" : ""}>${escapeHtml(profile.name)}</option>`)
    .join("");
}

function switchProfile(id) {
  if (!state.profiles.some((profile) => profile.id === id) || id === state.activeProfileId) return;
  state.activeProfileId = id;
  CATEGORY_ORDER.forEach((category) => ui.selected[category].clear());
  ui.searchQuery = "";
  ui.sort = { high: null, medium: null, low: null, familiar: null };
  saveState();
  render();
  toast(`已切换到「${activeProfile().name}」`);
}

function addProfile(name) {
  const trimmed = String(name || "").trim();
  if (!trimmed) {
    toast("请输入用户名", "warn");
    return;
  }
  const profile = {
    id: uid(),
    name: trimmed,
    words: [],
    articles: [],
    createdAt: Date.now()
  };
  state.profiles.push(profile);
  state.activeProfileId = profile.id;
  CATEGORY_ORDER.forEach((category) => ui.selected[category].clear());
  ui.searchQuery = "";
  saveState();
  closeModal();
  render();
  toast(`已新增用户「${trimmed}」`);
}

function renameProfile(id, name) {
  const profile = state.profiles.find((item) => item.id === id);
  const trimmed = String(name || "").trim();
  if (!profile) return;
  if (!trimmed) {
    toast("用户名不能为空", "warn");
    return;
  }
  profile.name = trimmed;
  saveState();
  render();
  toast("用户名已更新");
}

function deleteProfile(id) {
  if (state.profiles.length <= 1) {
    toast("至少保留一个用户", "warn");
    return;
  }
  const profile = state.profiles.find((item) => item.id === id);
  if (!profile) return;
  if (!window.confirm(`删除用户「${profile.name}」及其全部单词和文章？此操作不可恢复。`)) return;
  state.profiles = state.profiles.filter((item) => item.id !== id);
  if (state.activeProfileId === id) {
    state.activeProfileId = state.profiles[0].id;
  }
  CATEGORY_ORDER.forEach((category) => ui.selected[category].clear());
  saveState();
  render();
  toast(`已删除用户「${profile.name}」`);
}

function renderSection(category) {
  const meta = CATEGORY_META[category];
  const allWords = wordsForCategory(category);
  const words = allWords.filter(matchesSearch);
  const searching = !!normalizeKey(ui.searchQuery || "");
  const countLabel = searching
    ? `<span class="count-pill">${words.length}/${allWords.length}</span>`
    : `<span class="count-pill">${allWords.length}</span>`;
  const moveButtons = CATEGORY_ORDER
    .filter((target) => target !== category)
    .map((target) => {
      const disabled = ui.selected[category].size ? "" : "disabled";
      return `<button class="btn small" data-action="move" data-from="${category}" data-to="${target}" ${disabled}>移入${CATEGORY_META[target].short}</button>`;
    })
    .join("");
  const exportButton = (category === "high" || category === "medium")
    ? `<button class="btn small" data-action="export-category" data-cat="${category}" title="导出该类别全部单词">导出</button>`
    : "";
  const fillButton = meta.table
    ? `<button class="btn small" data-action="fill-fields" data-cat="${category}" ${allWords.some(needsFields) ? "" : "disabled"}>补齐字段</button>`
    : "";
  const emptyText = searching
    ? "未找到匹配单词"
    : "暂无单词，点击右上角“词汇录入”添加";

  if (!meta.table) {
    const deleteButton = `<button class="btn small danger" data-action="delete-selected" data-cat="${category}" ${ui.selected[category].size ? "" : "disabled"}>批量删除</button>`;
    return `
      <section class="section" data-category="${category}">
        <div class="section-head">
          <h2>${meta.label}${countLabel}</h2>
          <div class="move-bar">${exportButton}${fillButton}${moveButtons}${deleteButton}</div>
        </div>
        <div class="basic-box">
          <div class="basic-grid" id="basic-list">${renderBasicRows(words)}</div>
        </div>
      </section>`;
  }

  const displayed = sortWordsForCategory(category, words);
  const sortMode = ui.sort[category] || null;
  const sortIcon = sortMode === "asc" ? "↑" : sortMode === "desc" ? "↓" : "↕";
  return `
    <section class="section" data-category="${category}">
      <div class="section-head">
        <h2>${meta.label}${countLabel}</h2>
        <div class="move-bar">${exportButton}${fillButton}${moveButtons}</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-check"></th>
              <th class="col-word">单词</th>
              <th class="col-meaning">词意</th>
              <th class="col-pos">词性</th>
              <th class="col-collocation">搭配</th>
              <th class="col-sentence">造句</th>
              <th class="col-count"><button class="sort-btn" data-action="sort-count" data-cat="${category}" title="按重复次数排序">重复次数 <span class="sort-icon">${sortIcon}</span></button></th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody>
            ${displayed.length ? displayed.map(renderWordRow).join("") : `<tr><td colspan="8" class="empty-cell">${emptyText}</td></tr>`}
          </tbody>
        </table>
      </div>
    </section>`;
}

function renderWordRow(word) {
  const checked = ui.selected[word.category].has(word.id) ? "checked" : "";
  const meanings = Array.isArray(word.meanings) ? word.meanings : [];
  const checkbox = `<input type="checkbox" data-action="select" data-cat="${word.category}" data-id="${word.id}" ${checked}>`;
  const count = word.category === "basic" ? "" : `<span class="count-pill">${word.count}</span>`;
  const actions = `
    <button class="icon-action" data-action="regen" data-id="${word.id}" title="重新生成" aria-label="重新生成">↻</button>
    <button class="icon-action danger" data-action="delete" data-id="${word.id}" title="删除" aria-label="删除">×</button>`;

  if (!meanings.length) {
    const meaningCell = word.status === "pending"
      ? '<span class="muted">生成中…</span>'
      : (word.status === "failed"
        ? `<button class="link-btn" data-action="regen" data-id="${word.id}">生成失败，点击重试</button>`
        : '<span class="sense-empty">—</span>');
    return `
      <tr data-id="${word.id}">
        <td class="col-check">${checkbox}</td>
        <td class="col-word">${escapeHtml(word.text)}</td>
        <td class="cell col-meaning"><div class="sense-lines"><div class="sense-line">${meaningCell}</div></div></td>
        <td class="cell col-pos"><div class="sense-lines"><div class="sense-line"><span class="sense-empty">—</span></div></div></td>
        <td class="cell col-collocation"><div class="sense-lines"><div class="sense-line"><span class="sense-empty">—</span></div></div></td>
        <td class="cell col-sentence"><div class="sense-lines"><div class="sense-line"><span class="sense-empty">—</span></div></div></td>
        <td class="col-count">${count}</td>
        <td class="col-actions">${actions}</td>
      </tr>`;
  }

  return meanings.map((group, meaningIndex) => {
    const first = meaningIndex === 0;
    const senses = group.senses && group.senses.length
      ? group.senses
      : [{ partOfSpeech: "", collocation: "", sentence: "" }];
    const line = (value) => value
      ? escapeHtml(value)
      : '<span class="sense-empty">—</span>';
    const senseLines = (field) => senses.map((sense, senseIndex) => `
      <div class="sense-line" data-action="edit" data-id="${word.id}" data-kind="sense" data-meaning="${meaningIndex}" data-sense="${senseIndex}" data-field="${field}">${line(sense[field] || "")}</div>`).join("");
    const meaningLine = `
      <div class="sense-line" data-action="edit" data-id="${word.id}" data-kind="meaning" data-meaning="${meaningIndex}">${line(group.meaning || "")}</div>`;
    return `
      <tr class="meaning-row${first ? " first-meaning-row" : ""}" data-id="${word.id}">
        ${first ? `<td class="col-check" rowspan="${meanings.length}">${checkbox}</td><td class="col-word" rowspan="${meanings.length}">${escapeHtml(word.text)}</td>` : ""}
        <td class="cell col-meaning"><div class="sense-lines">${meaningLine}</div></td>
        <td class="cell col-pos"><div class="sense-lines">${senseLines("partOfSpeech")}</div></td>
        <td class="cell col-collocation"><div class="sense-lines">${senseLines("collocation")}</div></td>
        <td class="cell col-sentence"><div class="sense-lines">${senseLines("sentence")}</div></td>

function renderHighlighted(text, matches) {
  let output = "";
  let cursor = 0;
  (matches || []).forEach((match) => {
    const start = Number(match.start);
    const end = Number(match.end);
    if (!Number.isFinite(start) || !Number.isFinite(end) || start < cursor || end > text.length || start >= end) return;
    output += escapeHtml(text.slice(cursor, start));
    output += `<span class="hl">${escapeHtml(text.slice(start, end))}</span>`;
    cursor = end;
  });
  output += escapeHtml(text.slice(cursor));
  return output.replace(/\n/g, "<br>");
}

function startEdit(line) {
  if (!line || line.querySelector(".cell-input")) return;
  const word = getWords().find((item) => item.id === line.dataset.id);
  if (!word) return;
  const kind = line.dataset.kind;
  const meaningIndex = Number(line.dataset.meaning);
  const senseIndex = Number(line.dataset.sense);
  let value = "";
  if (kind === "meaning") {
    const group = (word.meanings || [])[meaningIndex];
    if (!group) return;
    value = group.meaning || "";
  } else {
    const group = (word.meanings || [])[meaningIndex];
    const sense = group && (group.senses || [])[senseIndex];
    if (!sense) return;
    value = sense[line.dataset.field] || "";
  }
  const input = document.createElement("input");
  input.className = "cell-input";
  input.value = value;
  line.innerHTML = "";
  line.appendChild(input);
  input.focus();
  input.select();
}

function commitEdit(input) {
  const line = input.closest(".sense-line");
  if (!line || line.dataset.committed === "1") return;
  line.dataset.committed = "1";
  if (input.dataset.cancel === "1") {
    render();
    return;
  }
  const word = getWords().find((item) => item.id === line.dataset.id);
  if (!word) return;
  const kind = line.dataset.kind;
  const meaningIndex = Number(line.dataset.meaning);
  const senseIndex = Number(line.dataset.sense);
  const value = input.value.trim();
  if (kind === "meaning") {
    const group = (word.meanings || [])[meaningIndex];
    if (group) group.meaning = value;
  } else {
    const group = (word.meanings || [])[meaningIndex];
    const sense = group && (group.senses || [])[senseIndex];
    if (sense) sense[line.dataset.field] = value;
  }
  syncLegacyFields(word);
  word.updatedAt = Date.now();
  saveState();
  render();
}

async function moveSelected(from, to) {
  const selected = Array.from(ui.selected[from]);
  if (!selected.length) return;
  const words = getWords().filter((word) => selected.includes(word.id));
  if (words.some((word) => word.count > 0)) {
    const ok = window.confirm(`这 ${words.length} 个单词的重复次数将清零，确定移动吗？`);
    if (!ok) return;
  }
  const needGeneration = [];
  words.forEach((word) => {
    word.category = to;
    word.count = 0;
    word.updatedAt = Date.now();
    if (to !== "basic" && !word.meaning && !word.sentence) {
      word.status = "pending";
      needGeneration.push(word.id);
    }
  });
  ui.selected[from].clear();
  saveState();
  render();
  toast(`已移动 ${words.length} 个单词到${CATEGORY_META[to].label}，重复次数已清零`);
  if (needGeneration.length) {
    await generateWords(needGeneration);
  }
}

function parseEntryLines(lines) {
  const seen = new Set();
  const valid = [];
  const invalid = [];
  const duplicates = [];
  lines.forEach((raw) => {
    const text = String(raw || "").replace(/\s+/g, " ").trim();
    if (!text) return;
    const key = normalizeKey(text);
    const singleWord = /^[A-Za-z]$/.test(text);
    const phrase = /^[A-Za-z](?:[A-Za-z' -]{0,44}[A-Za-z])?$/.test(text);
    if ((!singleWord && !phrase) || text.split(" ").length > 5 || text.length > 46) {
      invalid.push(text);
      return;
    }
    if (seen.has(key) || getWords().some((word) => word.key === key)) {
      duplicates.push(text);
      return;
    }
    seen.add(key);
    valid.push(text);
  });
  return { valid, invalid, duplicates };
}

async function submitEntry() {
  const category = document.getElementById("entry-category").value;
  const rawText = document.getElementById("entry-batch").value;
  const parsed = parseEntryLines(String(rawText || "").split(/\r?\n/));
  if (!parsed.valid.length) {
    const reason = parsed.invalid.length
      ? "输入内容不符合单词或短语格式"
      : (parsed.duplicates.length ? "这些单词已经存在" : "请输入至少一个单词");
    toast(reason, "warn");
    return;
  }

  let checked = [];
  if (ui.serverOnline && ui.aiConfigured) {
    checked = await runSpellingCheck(parsed.valid);
  } else {
    toast("AI 未配置，已跳过拼写校验", "warn");
  }
  const suspects = checked.filter((item) => {
    const original = String(item.original || "");
    const corrected = String(item.corrected || "");
    return item.status === "suspect"
      && corrected
      && normalizeKey(corrected) !== normalizeKey(original);
  });
  if (suspects.length) {
    ui.pendingEntry = { category, rawText, parsed, suspects };
    ui.modal = { type: "spelling", items: suspects };
    renderModal();
    return;
  }
  commitEntry(parsed.valid, category, parsed);
}

async function runSpellingCheck(words) {
  if (!words.length) return [];
  if (words.length > 200) {
    const ok = window.confirm(`本次有 ${words.length} 个词，拼写校验会比较慢。现在校验吗？`);
    if (!ok) return [];
  }
  openProgressModal("正在校验拼写…");
  const chunkSize = 50;
  const results = [];
  try {
    for (let index = 0; index < words.length; index += chunkSize) {
      const chunk = words.slice(index, index + chunkSize);
      updateProgressModal(
        `正在校验第 ${index + 1}-${Math.min(index + chunk.length, words.length)} / ${words.length} 个词…`,
        Math.floor(index / chunkSize),
        Math.ceil(words.length / chunkSize)
      );
      const response = await fetch("/api/check-spelling", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          words: chunk.map((text, offset) => ({ id: `sp-${index + offset}`, text }))
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      results.push(...(Array.isArray(data.results) ? data.results : []));
    }
  } catch (error) {
    closeModal();
    toast("拼写校验失败，将直接录入：" + error.message, "warn");
    return [];
  }
  closeModal();
  return results;
}

function commitEntry(texts, category, parsed) {
  ui.pendingEntry = null;
  const finalParsed = parseEntryLines(texts);
  if (!finalParsed.valid.length) {
    toast("没有可录入的新单词", "warn");
    return;
  }
  const now = Date.now();
  const newWords = finalParsed.valid.map((text) => ({
    id: uid(),
    text,
    key: normalizeKey(text),
    category,
    meaning: "",
    partOfSpeech: "",
    collocation: "",
    sentence: "",
    meanings: [],
    forms: [normalizeKey(text)],
    count: 0,
    status: category === "basic" ? "ready" : "pending",
    createdAt: now,
    updatedAt: now
  }));
  getWords().push(...newWords);
  saveState();
  closeModal();
  render();
  const summary = [`已录入 ${newWords.length} 个`];
  const duplicateCount = (parsed ? parsed.duplicates.length : 0) + finalParsed.duplicates.length;
  if (duplicateCount) summary.push(`跳过重复 ${duplicateCount} 个`);
  if (parsed && parsed.invalid.length) summary.push(`格式错误 ${parsed.invalid.length} 个`);
  toast(summary.join("，"));
  if (category !== "basic") {
    maybeGenerateWords(newWords.map((word) => word.id));
  }
}
