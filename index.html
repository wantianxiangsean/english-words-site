function mergeFilledMeanings(existing, filled) {
  return (existing || []).map((group, index) => {
    const key = normalizeKey(group.meaning);
    let match = (filled || []).find(
      (candidate) => normalizeKey(candidate.meaning) === key
    );
    if (!match && filled.length === existing.length) match = filled[index];
    if (!match && filled.length === 1) match = filled[0];
    return {
      meaning: group.meaning,
      senses: match && match.senses && match.senses.length
        ? match.senses
        : (group.senses || [])
    };
  });
}

async function fillWordFields(ids) {
  const words = ids
    .map((id) => getWords().find((word) => word.id === id))
    .filter(Boolean);
  if (!words.length) return;
  if (!ui.serverOnline) {
    toast("AI 服务未启动，请先双击 start.bat", "warn");
    return;
  }
  if (!ui.aiConfigured) {
    await openSettingsModal(() => fillWordFields(ids));
    return;
  }
  words.forEach((word) => {
    word.status = "pending";
    word.updatedAt = Date.now();
  });
  saveState();
  render();
  openProgressModal("正在补齐缺失字段…");

  let success = 0;
  let failed = 0;
  const batchSize = 10;
  for (let index = 0; index < words.length; index += batchSize) {
    const batch = words.slice(index, index + batchSize);
    updateProgressModal(
      `正在补齐第 ${index + 1}-${Math.min(index + batch.length, words.length)} / ${words.length} 个词…`,
      Math.floor(index / batchSize),
      Math.ceil(words.length / batchSize)
    );
    let results = [];
    try {
      const response = await fetch("/api/fill-word-fields", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          words: batch.map((word) => ({
            id: word.id,
            text: word.text,
            meanings: word.meanings || []
          }))
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      results = Array.isArray(data.results) ? data.results : [];
    } catch (error) {
      console.error(error);
    }
    const byId = new Map(results.map((item) => [String(item.id), item]));
    batch.forEach((word) => {
      const result = byId.get(word.id);
      if (result && result.status === "ready") {
        const filled = normalizeMeanings(result.meanings || []);
        word.meanings = mergeFilledMeanings(word.meanings || [], filled);
        syncLegacyFields(word);
        word.status = needsFields(word) ? "failed" : "ready";
      } else {
        word.status = "failed";
      }
      if (word.status === "ready") success += 1;
      else failed += 1;
      word.updatedAt = Date.now();
    });
    saveState();
    render();
  }
  closeModal();
  if (failed) {
    toast(`补齐完成：成功 ${success} 个，仍有 ${failed} 个字段未补全，可再点“补齐字段”重试`, "warn");
  } else {
    toast(`已补齐 ${success} 个单词的字段`);
  }
}

function mergeSensesIntoMeanings(existing, aiMeanings) {
  return (existing || []).map((group, index) => {
    const key = normalizeKey(group.meaning);
    let match = (aiMeanings || []).find(
      (candidate) => normalizeKey(candidate.meaning) === key
    );
    if (!match && aiMeanings.length === existing.length) match = aiMeanings[index];
    if (!match && aiMeanings.length === 1) match = aiMeanings[0];
    return {
      meaning: group.meaning,
      senses: match && match.senses && match.senses.length
        ? match.senses
        : (group.senses || [])
    };
  });
}

async function generateWords(ids, options = {}) {
  const words = ids
    .map((id) => getWords().find((word) => word.id === id))
    .filter(Boolean);
  if (!words.length) return;
  if (!ui.serverOnline) {
    words.forEach((word) => { word.status = "failed"; });
    saveState();
    render();
    toast("AI 服务未启动，请先双击 start.bat", "warn");
    return;
  }
  if (!ui.aiConfigured) {
    await openSettingsModal(() => generateWords(ids, options));
    return;
  }

  words.forEach((word) => {
    word.status = "pending";
    word.updatedAt = Date.now();
  });
  saveState();
  render();
  openProgressModal("正在生成单词字段…");

  let success = 0;
  let failed = 0;
  const batchSize = 20;
  for (let index = 0; index < words.length; index += batchSize) {
    const batch = words.slice(index, index + batchSize);
    updateProgressModal(
      `正在生成第 ${index + 1}-${Math.min(index + batch.length, words.length)} / ${words.length} 个词…`,
      Math.floor(index / batchSize),
      Math.ceil(words.length / batchSize)
    );
    let results = [];
    try {
      const response = await fetch("/api/generate-words", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ words: batch.map((word) => ({ id: word.id, text: word.text })) })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      results = Array.isArray(data.results) ? data.results : [];
    } catch (error) {
      console.error(error);
    }
    const byId = new Map(results.map((item) => [String(item.id), item]));
    batch.forEach((word) => {
      const result = byId.get(word.id);
      if (result && result.status === "ready" && result.entry) {
        const meanings = normalizeMeanings(result.entry.meanings || result.entry.senses || []);
        if (!meanings.length && (result.entry.meaning || result.entry.sentence)) {
          meanings.push({
            meaning: result.entry.meaning || "",
            senses: [{
              partOfSpeech: result.entry.partOfSpeech || "",
              collocation: result.entry.collocation || "",
              sentence: result.entry.sentence || ""
            }]
          });
        }
        word.meanings = options.preserveMeanings && Array.isArray(word.meanings) && word.meanings.length
          ? mergeSensesIntoMeanings(word.meanings, meanings)
          : meanings;
        syncLegacyFields(word);
        const aiForms = Array.isArray(result.entry.forms) ? result.entry.forms : [];
        word.forms = options.preserveMeanings && Array.isArray(word.forms) && word.forms.length
          ? Array.from(new Set([...word.forms, ...aiForms]))
          : (aiForms.length ? aiForms : [word.key]);
        word.status = "ready";
        success += 1;
      } else {
        word.status = "failed";
        failed += 1;
      }
      word.updatedAt = Date.now();
    });
    saveState();
    render();
  }
  closeModal();
  if (failed) {
    toast(`生成完成：成功 ${success} 个，失败 ${failed} 个；失败条目可点击重试`, "warn");
  } else {
    toast(`已生成 ${success} 个单词的字段`);
  }
}

function toPayloadWord(word) {
  return {
    id: word.id,
    text: word.text,
    key: word.key,
    category: word.category,
    forms: Array.isArray(word.forms) && word.forms.length ? word.forms : [word.key],
    meaning: word.meaning || "",
    partOfSpeech: word.partOfSpeech || "",
    meanings: Array.isArray(word.meanings) ? word.meanings : [],
    count: Number(word.count) || 0,
    createdAt: Number(word.createdAt) || 0
  };
}

async function handleGenerateArticle() {
  const hasTargets = getWords().some(
    (word) => word.category === "high" || word.category === "medium"
  );
  if (!hasTargets) {
    toast("请先在高频或中频中添加单词", "warn");
    return;
  }
  if (!ui.serverOnline) {
    toast("AI 服务未启动，请双击 start.bat", "warn");
    return;
  }
  if (!ui.aiConfigured) {
    await openSettingsModal(() => handleGenerateArticle());
    return;
  }
  const vocabulary = getWords().map(toPayloadWord);
  const countWords = getWords()
    .filter((word) => word.category !== "basic")
    .map(toPayloadWord);
  openProgressModal("正在生成文章…");
  let final = null;
  try {
    await streamArticle(
      { vocabulary },
      (event) => {
        if (event.event === "progress") {
          updateProgressModal(event.data.message || "生成中…", event.data.current, event.data.total);
        } else if (event.event === "done") {
          final = event.data;
        } else if (event.event === "error") {
          throw new Error(event.data.error || "文章生成失败");
        }
      }
    );
    if (!final) throw new Error("没有收到文章结果");
    saveArticle(final, countWords);
  } catch (error) {
    closeModal();
    toast("文章生成失败：" + error.message, "error");
  }
}

async function streamArticle(payload, onEvent) {
  const response = await fetch("/api/generate-article", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    throw new Error(data.error || `HTTP ${response.status}`);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const chunk = await reader.read();
    if (chunk.done) break;
    buffer += decoder.decode(chunk.value, { stream: true });
    let boundary = buffer.indexOf("\n\n");
    while (boundary >= 0) {
      const raw = buffer.slice(0, boundary);
      buffer = buffer.slice(boundary + 2);
      const event = parseSseEvent(raw);
      if (event) onEvent(event);
      boundary = buffer.indexOf("\n\n");
    }
  }
  if (buffer.trim()) {
    const event = parseSseEvent(buffer);
    if (event) onEvent(event);
  }
}

function parseSseEvent(raw) {
  let event = "message";
  const dataLines = [];
  String(raw || "").split(/\r?\n/).forEach((line) => {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
  });
  if (!dataLines.length) return null;
  try {
    return { event, data: JSON.parse(dataLines.join("\n")) };
  } catch (error) {
    return null;
  }
}

function saveArticle(result, countWords) {
  const targets = Array.isArray(result.targets) ? result.targets : [];
  const article = {
    id: uid(),
    title: result.title || "英语短文",
    theme: result.theme || "",
    english: result.english || "",
    translation: result.translation || "",
    matches: Array.isArray(result.matches) ? result.matches : [],
    translationMatches: Array.isArray(result.translationMatches) ? result.translationMatches : [],
    newWords: Array.isArray(result.newWords) ? result.newWords : [],
    wordCounts: result.wordCounts || {},
    categoryStats: result.categoryStats || {},
    valid: !!result.valid,
    warning: result.warning || "",
    repairRounds: Number(result.repairRounds) || 0,
    targetIds: targets.map((word) => word.id),
    snapshot: targets.map((word) => ({
      id: word.id,
      text: word.text,
      meaning: word.meaning,
      partOfSpeech: word.partOfSpeech,
      meanings: Array.isArray(word.meanings) ? word.meanings : [],
      category: word.category
    })),
    createdAt: Date.now(),
    cumulativeCounts: {}
  };
  Object.keys(article.wordCounts).forEach((id) => {
    const word = getWords().find((item) => item.id === id);
    if (word && word.category !== "basic") {
      word.count += Number(article.wordCounts[id]) || 0;
      word.updatedAt = Date.now();
    }
  });
  getWords().forEach((word) => {
    article.cumulativeCounts[word.id] = word.count;
  });
  getArticles().unshift(article);
  saveState();
  closeModal();
  render();
  openArticleModal(article.id);
  if (article.valid) {
    toast("文章生成完成，重复次数已累计");
  } else {
    toast("文章已生成，但频率未完全达标，请查看提示", "warn");
  }
}

function csvCell(value) {
  const text = String(value == null ? "" : value)
    .replace(/\r?\n/g, " ")
    .trim();
  return '"' + text.replace(/"/g, '""') + '"';
}

function exportCategoryWords(category) {
  const words = sortWordsForCategory(category, wordsForCategory(category));
  if (!words.length) {
    toast("该类别暂无单词", "warn");
    return;
  }
  const rows = [["单词", "词意", "词性", "搭配", "造句", "重复次数"]];
  words.forEach((word) => {
    const groups = wordMeaningGroups(word);
    if (!groups.length) {
      rows.push([
        word.text,
        word.meaning || "",
        word.partOfSpeech || "",
        word.collocation || "",
        word.sentence || "",
        String(Number(word.count) || 0)
      ]);
      return;
    }
    groups.forEach((group) => {
      const senses = group.senses && group.senses.length
        ? group.senses
        : [{ partOfSpeech: "", collocation: "", sentence: "" }];
      senses.forEach((sense) => {
        rows.push([
          word.text,
          group.meaning || "",
          sense.partOfSpeech || "",
          sense.collocation || "",
          sense.sentence || "",
          String(Number(word.count) || 0)
        ]);
      });
    });
  });
  const csv = rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  const filename = CATEGORY_META[category].label.replace(/[\\/:*?"<>|]/g, "_");
  anchor.href = url;
  anchor.download = `${filename}.csv`;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`已导出 ${words.length} 个单词`);
}

function renderMarkdownHighlights(text, matches) {
  let output = "";
  let cursor = 0;
  (matches || []).forEach((match) => {
    const start = Number(match.start);
    const end = Number(match.end);
    if (!Number.isFinite(start) || !Number.isFinite(end) || start < cursor || end > text.length || start >= end) return;
    output += text.slice(cursor, start);
    output += "**" + text.slice(start, end) + "**";
    cursor = end;
  });
  output += text.slice(cursor);
  return output;
}

function exportArticle(articleId) {
  const article = getArticles().find((item) => item.id === articleId);
  if (!article) return;
  const snapshot = new Map((article.snapshot || []).map((item) => [item.id, item]));
  const words = (article.targetIds || [])
    .map((id) => snapshot.get(id))
    .filter(Boolean)
    .sort((a, b) => {
      const byCategory = ARTICLE_CATEGORIES.indexOf(a.category) - ARTICLE_CATEGORIES.indexOf(b.category);
      return byCategory || String(a.text).localeCompare(String(b.text), "en");
    });
  const mdCell = (value) => String(value == null ? "" : value)
    .replace(/\|/g, "\\|")
    .replace(/\r?\n/g, " ")
    .trim();
  const lines = [];
  lines.push(`# ${article.title || "英语短文"}`, "");
  const meta = [formatDate(article.createdAt), article.valid ? "频率达标" : "频率未完全达标"];
  if (article.repairRounds) meta.push(`自动重写 ${article.repairRounds} 轮`);
  lines.push(`> ${meta.join(" · ")}`, "");
  if (!article.valid && article.warning) lines.push(`> ${article.warning}`, "");
  lines.push(renderMarkdownHighlights(article.english || "", article.matches || []), "");
  lines.push("## 重点词表", "");
  lines.push("| 单词 | 词性 | 词意 | 本次出现 | 累计次数 |");
  lines.push("| --- | --- | --- | ---: | ---: |");
  if (words.length) {
    words.forEach((item) => {
      const groups = wordMeaningGroups(item);
      const posText = groups
        .map((group) => (group.senses || [])
          .map((sense) => sense.partOfSpeech || "")
          .filter(Boolean)
          .join(" / "))
        .join("<br>");
      const meaningText = groups.map((group) => group.meaning || "").join("<br>");
      lines.push(`| ${mdCell(item.text)} | ${mdCell(posText)} | ${mdCell(meaningText)} | ${Number(article.wordCounts[item.id]) || 0} | ${Number(article.cumulativeCounts[item.id]) || 0} |`);
    });
  } else {
    lines.push("| - | - | - | 0 | 0 |");
  }
  lines.push(
    "",
    "## 中文翻译",
    "",
    renderMarkdownHighlights(article.translation || "", article.translationMatches || []),
    ""
  );
  const newWords = Array.isArray(article.newWords) ? article.newWords : [];
  if (newWords.length) {
    lines.push("## 未入库词汇", "");
    newWords.forEach((item) => {
      lines.push(`- ${mdCell(item.word)}（出现 ${Number(item.count) || 0} 次）`);
    });
    lines.push("");
  }

  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/markdown;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  const safeTitle = String(article.title || "英语短文")
    .replace(/[\\/:*?"<>|]/g, "_")
    .slice(0, 80) || "英语短文";
  anchor.href = url;
  anchor.download = `${safeTitle}.md`;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("已导出 Markdown");
}

function loadBackupConfig() {
  let stored = {};
  try {
    stored = JSON.parse(localStorage.getItem(BACKUP_CONFIG_KEY) || "{}") || {};
  } catch (error) {
    stored = {};
  }
  return {
    repo: stored.repo || DEFAULT_BACKUP_CONFIG.repo,
    branch: stored.branch || DEFAULT_BACKUP_CONFIG.branch,
    path: stored.path || DEFAULT_BACKUP_CONFIG.path,
    remember: !!stored.remember,
    hasToken: !!stored.hasToken,
    token: stored.token || ""
  };
}

function openBackupModal() {
  const config = loadBackupConfig();
  ui.backupToken = config.token || "";
  ui.modal = { type: "backup", config, status: "" };
  renderModal();
}

function backupFormConfig() {
  const repo = document.getElementById("backup-repo").value.trim();
  const branch = document.getElementById("backup-branch").value.trim() || "main";
  const path = document.getElementById("backup-path").value.trim() || "yoyo-english-backup.json";
  const tokenInput = document.getElementById("backup-token").value.trim();
  const remember = document.getElementById("backup-remember").checked;
  const token = tokenInput || ui.backupToken || "";
  return { repo, branch, path, remember, token };
}

function setBackupStatus(message, type) {
  if (ui.modal && ui.modal.type === "backup") ui.modal.status = message;
  const node = document.getElementById("backup-status");
  if (node) {
    node.className = "status-line" + (type ? " " + type : "");
    node.textContent = message;
  }
}

function saveBackupConfig(silent) {
  const config = backupFormConfig();
  const stored = {
    repo: config.repo,
    branch: config.branch,
    path: config.path,
    remember: config.remember,
    hasToken: !!config.token,
    token: config.remember ? config.token : ""
  };
  try {
    localStorage.setItem(BACKUP_CONFIG_KEY, JSON.stringify(stored));
  } catch (error) {
    console.error(error);
  }
  ui.backupToken = config.token;
  if (ui.modal && ui.modal.type === "backup") ui.modal.config = stored;
  if (!silent) setBackupStatus("备份设置已保存", "ok");
  return config;
}

function toBase64Utf8(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
  return btoa(binary);
}

function fromBase64Utf8(base64) {
  const binary = atob(String(base64 || "").replace(/\s/g, ""));
  const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

async function githubBackupRequest(path, options, token) {
  const headers = {
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
    "Authorization": "Bearer " + token
  };
  if (options.body) headers["Content-Type"] = "application/json";
  const response = await fetch("https://api.github.com" + path, {
    method: options.method || "GET",
    headers,
    body: options.body
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(data.message || `HTTP ${response.status}`);
    error.status = response.status;
    error.data = data;
    throw error;
  }
  return data;
}

function backupFileApiPath(config) {
  const encodedPath = encodeURIComponent(config.path).replace(/%2F/g, "/");
  return `/repos/${config.repo}/contents/${encodedPath}`;
}

async function backupToCloud() {
  const config = saveBackupConfig(true);
  if (!config.repo || !config.repo.includes("/")) {
    setBackupStatus("请先填写 owner/repo", "err");
    return;
  }
  if (!config.token) {
    setBackupStatus("请填写 GitHub Token", "err");
    return;
  }
  const lockKey = "yoyo-backup-lock";
  const now = Date.now();
  const lockTime = Number(localStorage.getItem(lockKey) || 0);
  if (lockTime && now - lockTime < 120000) {
    setBackupStatus("另一个页面正在备份，请稍后再试", "err");
    return;
  }
  localStorage.setItem(lockKey, String(now));
  setBackupStatus("正在备份…");
  const apiPath = backupFileApiPath(config);
  try {
    const payload = {
      app: "yoyo-english",
      version: 2,
      exportedAt: new Date().toISOString(),
      state
    };
    const body = {
      message: "备份单词记忆数据 " + new Date().toLocaleString("zh-CN"),
      content: toBase64Utf8(JSON.stringify(payload)),
      branch: config.branch
    };
    for (let attempt = 0; attempt < 5; attempt += 1) {
      let sha = null;
      try {
        const existing = await githubBackupRequest(
          `${apiPath}?ref=${encodeURIComponent(config.branch)}`,
          { method: "GET" },
          config.token
        );
        sha = existing.sha;
      } catch (error) {
        if (error.status !== 404) throw error;
      }
      if (sha) body.sha = sha;
      else delete body.sha;
      try {
        const result = await githubBackupRequest(
          apiPath,
          { method: "PUT", body: JSON.stringify(body) },
          config.token
        );
        const commit = result.commit && result.commit.sha
          ? result.commit.sha.slice(0, 7)
          : "已提交";
        setBackupStatus("备份成功：" + commit, "ok");
        toast("云端备份成功");
        return;
      } catch (error) {
        if ((error.status === 409 || error.status === 422) && attempt < 4) {
          setBackupStatus(`检测到并发更新，正在重试（${attempt + 2}/5）…`);
          await new Promise((resolve) => setTimeout(resolve, 800));
          continue;
        }
        setBackupStatus("备份失败：" + error.message, "err");
        return;
      }
    }
    setBackupStatus("备份失败：多次冲突，请稍后重试", "err");
  } finally {
    localStorage.removeItem(lockKey);
  }
}

async function restoreFromCloud() {
  const config = saveBackupConfig(true);
  if (!config.repo || !config.repo.includes("/") || !config.token) {
    setBackupStatus("请先填写 owner/repo 和 Token", "err");
    return;
  }
  setBackupStatus("正在读取云端数据…");
  const apiPath = backupFileApiPath(config);
  try {
    const file = await githubBackupRequest(
      `${apiPath}?ref=${encodeURIComponent(config.branch)}`,
      { method: "GET" },
      config.token
    );
    const payload = JSON.parse(fromBase64Utf8(file.content || ""));
    if (!payload || !payload.state || !Array.isArray(payload.state.profiles)) {
      throw new Error("云端文件格式不正确");
    }
    const ok = window.confirm(
      "将用云端数据覆盖本机全部用户、单词和文章，未备份的本机修改会丢失。继续吗？"
    );
    if (!ok) {
      setBackupStatus("已取消恢复");
      return;
    }
    localStorage.setItem(BACKUP_PRE_RESTORE_KEY, JSON.stringify(state));
    state = normalizeStateObject(payload.state);
    CATEGORY_ORDER.forEach((category) => ui.selected[category].clear());
    ui.searchQuery = "";
    saveState();
    render();
    setBackupStatus(
      `恢复成功：${state.profiles.length} 个用户，导出时间 ${payload.exportedAt || "未知"}`,
      "ok"
    );
    toast("已从云端恢复");
  } catch (error) {
    setBackupStatus("恢复失败：" + error.message, "err");
  }
}

function undoRestore() {
  const raw = localStorage.getItem(BACKUP_PRE_RESTORE_KEY);
  if (!raw) {
    setBackupStatus("没有可撤销的恢复记录", "err");
    return;
  }
  try {
    state = normalizeStateObject(JSON.parse(raw));
    CATEGORY_ORDER.forEach((category) => ui.selected[category].clear());
    ui.searchQuery = "";
    saveState();
    render();
    localStorage.removeItem(BACKUP_PRE_RESTORE_KEY);
    setBackupStatus("已撤销上次恢复", "ok");
    toast("已恢复本机原有数据");
  } catch (error) {
    setBackupStatus("撤销失败：" + error.message, "err");
  }
}

async function saveSettings() {
  const baseUrl = document.getElementById("settings-base").value.trim();
  const model = document.getElementById("settings-model").value.trim();
  const apiKey = document.getElementById("settings-key").value.trim();
  const status = document.getElementById("settings-status");
  if (!ui.serverOnline) {
    if (status) {
      status.className = "status-line err";
      status.textContent = "后端未启动，无法保存。";
    }
    return;
  }
  try {
    const response = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ baseUrl, model, apiKey })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    ui.config = data.config || Object.assign({}, ui.config, { baseUrl, model, hasKey: !!apiKey || ui.config.hasKey });
    ui.aiConfigured = !!ui.config.hasKey && !!ui.config.model;
    const callback = ui.modal && ui.modal.onSaved;
    closeModal();
    renderBanner();
    toast("AI 设置已保存");
    if (typeof callback === "function") callback();
  } catch (error) {
    if (status) {
      status.className = "status-line err";
      status.textContent = "保存失败：" + error.message;
    }
  }
}

async function testSettings() {
  const status = document.getElementById("settings-status");
  const baseUrl = document.getElementById("settings-base").value.trim();
  const model = document.getElementById("settings-model").value.trim();
  const apiKey = document.getElementById("settings-key").value.trim();
  if (status) {
    status.className = "status-line";
    status.textContent = "正在测试连接…";
  }
  try {
    const response = await fetch("/api/config/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ baseUrl, model, apiKey })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
    if (status) {
      status.className = "status-line ok";
      status.textContent = "连接成功，模型回复：" + (data.reply || "OK");
    }
  } catch (error) {
    if (status) {
      status.className = "status-line err";
      status.textContent = "连接失败：" + error.message;
    }
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  seedYouyouWords();
  render();
  document.getElementById("btn-entry").addEventListener("click", () => openEntryModal());
  document.getElementById("btn-article").addEventListener("click", handleGenerateArticle);
  document.getElementById("btn-settings").addEventListener("click", () => openSettingsModal());
  document.getElementById("btn-backup").addEventListener("click", openBackupModal);
  document.getElementById("profile-select").addEventListener("change", (event) => switchProfile(event.target.value));
  document.getElementById("btn-profiles").addEventListener("click", openProfilesModal);
  document.getElementById("global-search").addEventListener("input", (event) => {
    ui.searchQuery = event.target.value;
    render();
  });

  document.getElementById("sections").addEventListener("click", (event) => {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    if (action === "move") moveSelected(target.dataset.from, target.dataset.to);
    else if (action === "delete-selected") deleteSelected(target.dataset.cat);
    else if (action === "delete") deleteWord(target.dataset.id);
    else if (action === "regen") generateWords([target.dataset.id]);
    else if (action === "edit") startEdit(target);
    else if (action === "sort-count") toggleSort(target.dataset.cat);
    else if (action === "export-category") exportCategoryWords(target.dataset.cat);
    else if (action === "fill-fields") fillMissingFields(target.dataset.cat);
  });

  document.getElementById("sections").addEventListener("change", (event) => {
    const checkbox = event.target.closest('[data-action="select"]');
    if (!checkbox) return;
    const category = checkbox.dataset.cat;
    if (checkbox.checked) ui.selected[category].add(checkbox.dataset.id);
    else ui.selected[category].delete(checkbox.dataset.id);
    render();
  });

  document.getElementById("sections").addEventListener("blur", (event) => {
    if (event.target.matches(".cell-input")) commitEdit(event.target);
  }, true);

  document.getElementById("sections").addEventListener("keydown", (event) => {
    if (!event.target.matches(".cell-input")) return;
    if (event.key === "Enter") {
      event.preventDefault();
      event.target.blur();
    } else if (event.key === "Escape") {
      event.target.dataset.cancel = "1";
      event.target.blur();
    }
  });

  document.getElementById("modal-root").addEventListener("click", async (event) => {
    if (event.target.classList.contains("modal-backdrop")) {
      if (ui.modal && ui.modal.type !== "progress") closeModal();
      return;
    }
    const target = event.target.closest("[data-modal-action]");
    if (!target) return;
    const action = target.dataset.modalAction;
    if (action === "close") closeModal();
    else if (action === "entry-submit") submitEntry();
    else if (action === "settings-test") testSettings();
    else if (action === "settings-save") saveSettings();
    else if (action === "backup-save") saveBackupConfig(false);
    else if (action === "backup-now") backupToCloud();
    else if (action === "backup-restore") restoreFromCloud();
    else if (action === "undo-restore") undoRestore();
    else if (action === "add-profile") {
      const input = document.getElementById("new-profile-name");
      addProfile(input && input.value);
    }
    else if (action === "rename-profile") {
      const input = document.querySelector(`[data-profile-id="${target.dataset.id}"]`);
      renameProfile(target.dataset.id, input && input.value);
    }
    else if (action === "delete-profile") deleteProfile(target.dataset.id);
    else if (action === "spelling-back") {
      const pending = ui.pendingEntry;
      closeModal();
      if (pending) openEntryModal(pending.rawText, pending.category);
    }
    else if (action === "spelling-keep") {
      const pending = ui.pendingEntry;
      if (pending) {
        closeModal();
        commitEntry(pending.parsed.valid, pending.category, pending.parsed);
      }
    }
    else if (action === "spelling-fix") {
      const pending = ui.pendingEntry;
      if (pending) {
        const suggestions = new Map(
          pending.suspects.map((item) => [normalizeKey(item.original), item.corrected])
        );
        const corrected = pending.parsed.valid.map(
          (text) => suggestions.get(normalizeKey(text)) || text
        );
        closeModal();
        commitEntry(corrected, pending.category, pending.parsed);
      }
    }
    else if (action === "article-new") { closeModal(); handleGenerateArticle(); }
    else if (action === "article-history") openHistoryModal();
    else if (action === "article-export") exportArticle(target.dataset.id);
    else if (action === "add-new-word") addNewWordToHigh(target.dataset.word);
    else if (action === "open-article") openArticleModal(target.dataset.id);
    else if (action === "article-delete") {
      const article = getArticles().find((item) => item.id === target.dataset.id);
      if (!article) return;
      if (!window.confirm(`删除文章“${article.title}”？单词重复次数不会回退。`)) return;
      setArticles(getArticles().filter((item) => item.id !== article.id));
      saveState();
      openHistoryModal();
      toast("文章已删除，重复次数保持不变");
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && ui.modal && ui.modal.type !== "progress") closeModal();
  });

  window.addEventListener("focus", refreshHealth);
  await refreshHealth();
  if (ui.serverOnline && !ui.aiConfigured) {
    openSettingsModal();
  }
  await autoFillYouyouFields();
});
</script>
